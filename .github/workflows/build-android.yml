name: Build Android APK

on:
  push:
    branches: [claude/android-ai-agent-app-2tsNk, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js 18 ───────────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 4. npm install ───────────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: AndroidAgent
        run: npm install --verbose 2>&1 | tail -40

      # ── 5. Android SDK ──────────────────────────────────────────────────────
      - name: Accept Android SDK licences & install components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f | head -1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Create local.properties
        working-directory: AndroidAgent/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 7. Keystore ──────────────────────────────────────────────────────────
      - name: Generate debug keystore
        working-directory: AndroidAgent/android/app
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── 8. Build ─────────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: AndroidAgent/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            2>&1 | tee /tmp/gradle-build.log

      # ── On failure: post readable snippet to PR ───────────────────────────────
      - name: Post failure details to PR
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=/tmp/gradle-build.log
          if [ -f "$LOG" ]; then
            SNIPPET=$(grep -E "FAILURE:|> Task|Exception|error:|Could not|Unresolved" "$LOG" \
              | head -60 | sed "s/\`/'/g")
          else
            SNIPPET="No gradle log — failure happened before the build step."
          fi
          gh pr comment 1 --body "## Build #${{ github.run_number }} failed

\`\`\`
${SNIPPET}
\`\`\`" || true

      - name: Upload full Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          retention-days: 7

      # ── 9. Package & release ─────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p dist
          cp AndroidAgent/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/AndroidAgent-build-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAgent-build-${{ github.run_number }}
          path: dist/AndroidAgent-build-${{ github.run_number }}.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Android Agent — Build #${{ github.run_number }}" \
            --notes "Κατέβασε το APK, άνοιξέ το στο κινητό → Εγκατάσταση. Απαιτείται Android 8.0+." \
            "dist/AndroidAgent-build-${{ github.run_number }}.apk"
