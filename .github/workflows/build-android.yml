name: Build Android APK

on:
  push:
    branches: [claude/android-ai-agent-app-2tsNk, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Κώδικας ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js 18 ───────────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 4. npm dependencies ─────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: AndroidAgent
        run: npm install

      # ── 5. Gradle wrapper ────────────────────────────────────────────────────
      # Running `gradle wrapper` inside the RN android/ dir fails because
      # Gradle configures the full project (loads the RN plugin) before it
      # can run any task. Fix: generate the wrapper in an isolated empty
      # project, then copy gradlew + gradle-wrapper.jar into android/.
      - name: Download Gradle 8.6 distribution
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip \
               -O /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /tmp/gradle

      - name: Generate Gradle wrapper in isolated project
        run: |
          mkdir -p /tmp/wrapper-init
          echo 'rootProject.name = "wrapper-init"' > /tmp/wrapper-init/settings.gradle
          /tmp/gradle/gradle-8.6/bin/gradle wrapper \
            --gradle-version=8.6 \
            --project-dir /tmp/wrapper-init
          mkdir -p AndroidAgent/android/gradle/wrapper
          cp /tmp/wrapper-init/gradle/wrapper/gradle-wrapper.jar \
             AndroidAgent/android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/wrapper-init/gradlew AndroidAgent/android/gradlew
          chmod +x AndroidAgent/android/gradlew

      # ── 6. Android SDK ──────────────────────────────────────────────────────
      - name: Accept Android SDK licences & install required components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Diagnose SDK environment
        run: |
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== NDK versions ==="
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "(no ndk dir)"
          echo "=== Build-tools ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "(no build-tools dir)"
          echo "=== Platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "(no platforms dir)"
          echo "=== Node ==="
          node --version && which node

      - name: Create local.properties
        working-directory: AndroidAgent/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 7. Debug Keystore ───────────────────────────────────────────────────
      - name: Generate debug keystore
        working-directory: AndroidAgent/android/app
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── 8. Build ─────────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: AndroidAgent/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --info \
            2>&1 | tee /tmp/gradle-build.log

      - name: Upload Gradle build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          retention-days: 7

      # ── 9. Rename APK ────────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p dist
          cp AndroidAgent/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/AndroidAgent-build-${{ github.run_number }}.apk"

      # ── 10. Upload ως artifact (30 μέρες) ────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAgent-build-${{ github.run_number }}
          path: dist/AndroidAgent-build-${{ github.run_number }}.apk
          retention-days: 30

      # ── 11. Δημιουργία GitHub Release με το APK ──────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.build-${{ github.run_number }}"
          NOTES=$(cat <<'NOTES_EOF'
          ## Εγκατάσταση στο κινητό
          1. Κατέβασε το .apk αρχείο παρακάτω
          2. Άνοιξέ το από το κινητό → πάτησε **Εγκατάσταση**
          3. Αν εμφανιστεί "Άγνωστη πηγή": Ρυθμίσεις → Ασφάλεια → Εγκατάσταση άγνωστων εφαρμογών

          **Απαιτείται:** Android 8.0+ (API 26)
          NOTES_EOF
          )
          gh release create "$TAG" \
            --title "Android Agent — Build #${{ github.run_number }}" \
            --notes "$NOTES" \
            "dist/AndroidAgent-build-${{ github.run_number }}.apk"
