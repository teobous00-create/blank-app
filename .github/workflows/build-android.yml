name: Build Android APK

on:
  push:
    branches: [claude/android-ai-agent-app-2tsNk, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js 18 ───────────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 4. npm install (verbose so failures are visible) ────────────────────
      - name: Install npm dependencies
        working-directory: AndroidAgent
        run: npm install --verbose 2>&1 | tail -40

      # ── 5. Gradle wrapper ────────────────────────────────────────────────────
      - name: Download Gradle 8.6 distribution
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip \
               -O /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /tmp/gradle

      - name: Generate Gradle wrapper in isolated project
        run: |
          mkdir -p /tmp/wrapper-init
          echo 'rootProject.name = "wrapper-init"' > /tmp/wrapper-init/settings.gradle
          /tmp/gradle/gradle-8.6/bin/gradle wrapper \
            --gradle-version=8.6 \
            --project-dir /tmp/wrapper-init
          mkdir -p AndroidAgent/android/gradle/wrapper
          cp /tmp/wrapper-init/gradle/wrapper/gradle-wrapper.jar \
             AndroidAgent/android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/wrapper-init/gradlew AndroidAgent/android/gradlew
          chmod +x AndroidAgent/android/gradlew

      # ── 6. Android SDK ──────────────────────────────────────────────────────
      - name: Accept Android SDK licences & install components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME" -name "sdkmanager" -type f | head -1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Diagnose environment
        run: |
          echo "NODE=$(node --version) at $(which node)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK: $(ls $ANDROID_HOME/ndk/ 2>/dev/null || echo none)"
          echo "Platforms: $(ls $ANDROID_HOME/platforms/ 2>/dev/null || echo none)"
          echo "BuildTools: $(ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo none)"
          echo "node_modules exists: $(test -d AndroidAgent/node_modules && echo yes || echo NO)"
          echo "=== @react-native/gradle-plugin structure ==="
          ls AndroidAgent/node_modules/@react-native/gradle-plugin/ 2>/dev/null || echo "NOT FOUND"
          echo "=== RN gradle-plugin settings.gradle ==="
          cat AndroidAgent/node_modules/@react-native/gradle-plugin/settings.gradle 2>/dev/null || echo "NOT FOUND"

      - name: Create local.properties
        working-directory: AndroidAgent/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 7. Keystore ──────────────────────────────────────────────────────────
      - name: Generate debug keystore
        working-directory: AndroidAgent/android/app
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── 8. Build ─────────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: AndroidAgent/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace \
            2>&1 | tee /tmp/gradle-build.log

      # ── Post error as PR comment on failure (readable via API) ───────────────
      - name: Post failure details to PR
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=/tmp/gradle-build.log
          if [ -f "$LOG" ]; then
            SNIPPET=$(grep -E "FAILURE:|> Task|Exception|error:|Could not|Unresolved" "$LOG" \
              | head -60 | sed 's/`/'"'"'/g')
          else
            SNIPPET="No gradle log captured — failure happened before the build step."
          fi
          gh pr comment 1 --body "$(printf '## ❌ Build #%s failed\n\n```\n%s\n```' \
            '${{ github.run_number }}' "$SNIPPET")"

      - name: Upload full Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          retention-days: 7

      # ── 9. Package & release ─────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p dist
          cp AndroidAgent/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/AndroidAgent-build-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAgent-build-${{ github.run_number }}
          path: dist/AndroidAgent-build-${{ github.run_number }}.apk
          retention-days: 30

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Android Agent — Build #${{ github.run_number }}" \
            --notes "Κατέβασε το APK, άνοιξέ το στο κινητό → Εγκατάσταση. Απαιτείται Android 8.0+." \
            "dist/AndroidAgent-build-${{ github.run_number }}.apk"
