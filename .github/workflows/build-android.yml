name: Build Android APK

on:
  push:
    branches: [claude/android-ai-agent-app-2tsNk, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Κώδικας ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js 18 ───────────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 4. npm dependencies ─────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: AndroidAgent
        run: npm install

      # ── 5. Gradle — download binary then generate wrapper ────────────────────
      # setup-gradle@v3 only patches an existing wrapper; it does NOT put a
      # 'gradle' binary on PATH. We download the distribution ourselves so we
      # can run `gradle wrapper` to produce gradlew + gradle-wrapper.jar.
      - name: Download Gradle 8.6 distribution
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip \
               -O /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Generate Gradle wrapper
        working-directory: AndroidAgent/android
        run: |
          gradle wrapper --gradle-version=8.6
          chmod +x gradlew

      # ── 6. Android SDK ──────────────────────────────────────────────────────
      - name: Create local.properties
        working-directory: AndroidAgent/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 7. Debug Keystore ───────────────────────────────────────────────────
      - name: Generate debug keystore
        working-directory: AndroidAgent/android/app
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── 8. Build ─────────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: AndroidAgent/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 9. Rename APK ────────────────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p dist
          cp AndroidAgent/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/AndroidAgent-build-${{ github.run_number }}.apk"

      # ── 10. Upload ως artifact (30 μέρες) ────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAgent-build-${{ github.run_number }}
          path: dist/AndroidAgent-build-${{ github.run_number }}.apk
          retention-days: 30

      # ── 11. Δημιουργία GitHub Release με το APK ──────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.build-${{ github.run_number }}"
          NOTES=$(cat <<'NOTES_EOF'
          ## Εγκατάσταση στο κινητό
          1. Κατέβασε το .apk αρχείο παρακάτω
          2. Άνοιξέ το από το κινητό → πάτησε **Εγκατάσταση**
          3. Αν εμφανιστεί "Άγνωστη πηγή": Ρυθμίσεις → Ασφάλεια → Εγκατάσταση άγνωστων εφαρμογών

          **Απαιτείται:** Android 8.0+ (API 26)
          NOTES_EOF
          )
          gh release create "$TAG" \
            --title "Android Agent — Build #${{ github.run_number }}" \
            --notes "$NOTES" \
            "dist/AndroidAgent-build-${{ github.run_number }}.apk"
